services:
  # 1. Analytics DB (ClickHouse)
  # Хранит тики, стаканы, свечи и выполняет авто-агрегацию
  analytics_db:
    image: clickhouse/clickhouse-server:latest
    container_name: analytics_db
    ports:
      - "8123:8123"                     # HTTP порт (для DBeaver/Web)
      - "9000:9000"                     # Native порт (для Python клиента)
    env_file:
      - .env
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - analytics_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # 2. Orders DB (PostgreSQL)
  # Хранит историю сделок
  orders_db:
    image: postgres:15
    container_name: orders_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 3. Message Broker (RabbitMQ)
  rabbit:
    image: rabbitmq:3-management
    container_name: rabbit
    ports:
      - "5672:5672"   # AMQP порт
      - "15672:15672" # Веб-интерфейс (логин/пароль из .env)
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  # 4. ByBit Stats Service
  stats:
    build: 
      context: ./bybit-stats-service
    container_name: stats_service
    env_file:
      - .env
    depends_on:
      analytics_db:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    restart: always
    ports:
      - "8000:8000" 

  # 5. Binance Stats Service
  stats_binance:
    build: 
      context: ./binance-stats-service
    container_name: binance_stats
    env_file:
      - .env
    depends_on:
      analytics_db:
        condition: service_healthy
    restart: always
    ports:
      - "8010:8000" 

  # 6. Signal Service
  # Анализирует историю из ClickHouse и шлет сигналы BUY/SELL
  signal:
    build: 
      context: ./signal-service
    container_name: signal_service
    env_file:
      - .env
    depends_on:
      rabbit:
        condition: service_healthy
      analytics_db:
        condition: service_healthy
    restart: always
    ports:
      - "8020:8000" 

  # 7. Trade Control Service
  # Слушает сигналы и цены, управляет ордерами на бирже
  trade_control:
    build: 
      context: ./trade-control-service
    container_name: trade_control
    env_file:
      - .env
    depends_on:
      orders_db:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    restart: always
    ports:
      - "8030:8000"

volumes:
  analytics_data:
  orders_data: